
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d24">
<meta name="description" content="VEXO — Learn Beyond Limits. Discover free educational resources, study tools, notes and quizzes.">
<title>VEXO — Learn Beyond Limits</title>
<style>
:root{--bg:#0d0b1b;--panel:#17142b;--panel2:#201b3a;--text:#f6f4ff;--muted:#aaa5c5;--purple:#9875ff;--teal:#39dfc2;--line:#30294b;--red:#ff8397}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 70% 0%,#25204b 0%,var(--bg) 52%);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}
.sidebar{background:#100e20;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:3px 8px 25px}
.logo{width:43px;height:43px;border-radius:15px;background:linear-gradient(135deg,var(--purple),var(--teal));display:grid;place-items:center;color:#111026;font-weight:1000;font-size:21px;box-shadow:0 8px 28px #8062ff44}
.brand h1{font-size:19px;letter-spacing:2px;margin:0}
.brand small{color:var(--muted);display:block;font-size:10px;letter-spacing:1.5px}
.nav-label{color:#77718f;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:14px 12px 7px}
.nav{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;color:var(--muted);border:0;padding:11px 12px;border-radius:11px;margin:2px 0}
.nav:hover,.nav.active{background:linear-gradient(90deg,#9574ff26,#39dfc20d);color:var(--text)}
.nav.active{box-shadow:inset 3px 0 var(--teal)}
.nav span:first-child{width:23px;text-align:center;font-size:17px}
.side-bottom{margin-top:25px;padding:14px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px}
.main{min-width:0;padding:26px clamp(14px,3vw,38px) 50px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
.eyebrow{font-size:11px;color:var(--teal);letter-spacing:2px;text-transform:uppercase;font-weight:800}
h2{font-size:clamp(25px,3vw,35px);line-height:1.2;margin:7px 0}
h3{margin:0 0 9px;font-size:17px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#24203d;border:1px solid var(--line);padding:7px 11px;border-radius:30px;color:var(--muted);font-size:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:#2c2450;display:grid;place-items:center;border:1px solid #51437e;font-weight:800}
.hero{border:1px solid #413464;border-radius:24px;padding:clamp(22px,4vw,38px);background:linear-gradient(120deg,#272044ef,#17182ff0 65%,#123d3b99);position:relative;overflow:hidden;margin-bottom:22px}
.hero:after{content:"✦";position:absolute;font-size:180px;color:#9b7bff0d;right:24px;top:-35px;pointer-events:none}
.hero h2{max-width:650px;font-size:clamp(30px,4vw,46px)}
.gradient{background:linear-gradient(90deg,#c2aaff,var(--teal));background-clip:text;color:transparent}
.hero p{max-width:650px;color:#c0badb}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.btn{border:1px solid var(--line);background:#25203f;color:var(--text);border-radius:11px;padding:10px 15px;font-weight:700}
.btn:hover{filter:brightness(1.16)}
.btn.primary{background:linear-gradient(110deg,#9b7aff,#6e60d7);border-color:transparent;color:white}
.btn.teal{background:#123c3a;border-color:#246d63;color:#7df4dc}
.btn.ghost{background:transparent}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 25px}
.stat,.card{background:linear-gradient(145deg,#1c1932,#151326);border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0}
.stat .num{font-size:27px;font-weight:850;margin:5px 0}
.stat .label{font-size:12px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:25px 0 13px}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{transition:transform .15s,border-color .15s}
.card:hover{border-color:#62508f}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}
.iconbox{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:#2c244c;font-size:22px}
.tag{display:inline-block;border:1px solid #3a315a;color:#c8b8ff;border-radius:20px;padding:4px 9px;font-size:11px}
.field{background:#100e20;color:var(--text);border:1px solid #3a3159;border-radius:10px;padding:11px 12px;width:100%;outline:none}
.field:focus{border-color:var(--teal);box-shadow:0 0 0 2px #39dfc21a}
textarea.field{min-height:130px;resize:vertical}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.toolbar .field{flex:1;min-width:130px}
.notice{border:1px solid #54477c;background:#211b3a;border-radius:12px;padding:13px 15px;color:#d6cef4;margin:12px 0}
.resource-link{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.progress{height:7px;background:#302a47;border-radius:20px;overflow:hidden;margin:12px 0}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--teal));width:0}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#1b1730;color:var(--muted);padding:8px 12px;border-radius:22px}
.chip.active{border-color:var(--teal);color:var(--teal)}
.list{display:grid;gap:10px}
.list-item{background:#18152a;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:12px;align-items:flex-start}
.list-item input[type=checkbox]{width:18px;height:18px;margin-top:4px;accent-color:var(--teal)}
.empty{padding:35px;text-align:center;border:1px dashed #494064;border-radius:15px;color:var(--muted)}
.footer{margin-top:38px;padding-top:17px;border-top:1px solid var(--line);font-size:12px;color:#8983a5}
.hidden{display:none!important}
.mobile-menu{display:none}
.quiz-option{display:block;width:100%;text-align:left;padding:12px;background:#201b37;border:1px solid var(--line);border-radius:10px;color:var(--text);margin:8px 0}
.quiz-option:hover{border-color:var(--teal)}
.quiz-option.correct{border-color:var(--teal);background:#15332f}
.quiz-option.wrong{border-color:var(--red);background:#3a202f}
hr{border:0;border-top:1px solid var(--line);margin:17px 0}
@media(max-width:1050px){.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:20;left:-270px;top:0;width:250px;transition:left .2s;box-shadow:15px 0 50px #0007}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.main{padding:17px 14px 35px}.topbar{margin-bottom:17px}.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}.hero{border-radius:18px}.stats{gap:8px}.stat{padding:13px}.stat .num{font-size:23px}.section-head{align-items:flex-start}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar .field{min-width:0}.brand{padding-bottom:15px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">V</div><div><h1>VEXO</h1><small>LEARN BEYOND LIMITS</small></div></div>
  <div class="nav-label">WORKSPACE</div>
  <button class="nav active" data-page="dashboard"><span>⌂</span>Dashboard</button>
  <button class="nav" data-page="courses"><span>▦</span>Course Library</button>
  <button class="nav" data-page="notes"><span>▤</span>My Notes</button>
  <button class="nav" data-page="quiz"><span>✎</span>Quiz & Tests</button>
  <button class="nav" data-page="flashcards"><span>▣</span>Flashcards</button>
  <button class="nav" data-page="planner"><span>◷</span>Study Planner</button>
  <button class="nav" data-page="progress"><span>↗</span>Progress</button>
  <div class="nav-label">DISCOVER</div>
  <button class="nav" data-page="sources"><span>◎</span>Free Sources</button>
  <button class="nav" data-page="ai"><span>✧</span>AI Study Hub</button>
  <button class="nav" data-page="settings"><span>⚙</span>Settings</button>
  <div class="side-bottom"><b>✦ Keep learning</b><p>Small steps today. Bigger goals tomorrow.</p><span id="sideProgress">0 lessons completed</span></div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn mobile-menu" id="menuBtn" aria-label="Open navigation">☰</button>
      <div><div class="eyebrow">YOUR LEARNING SPACE</div><div class="muted small" id="today"></div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px"><span class="pill">✦ Free learning</span><div class="avatar" id="avatar">S</div></div>
  </header>
  <div id="content"></div>
  <footer class="footer">VEXO 2.0 · Learn beyond limits · External resources belong to their respective owners.</footer>
</main>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const subjects=[
 ["Mathematics","∑"],["Science","⚗"],["English","A"],["Bengali","অ"],
 ["History","⌛"],["Geography","🌍"],["Life Science","🌱"],
 ["Physical Science","⚡"],["Computer Studies","⌘"],["Environmental Studies","♧"]
];
const boards=["WBBSE","CBSE","ICSE"];
const classes=[6,7,8,9,10];
const sourceList=[
 {name:"Khan Academy India",desc:"Free lessons and practice in maths and other subjects.",url:"https://india.khanacademy.org/",icon:"🎓"},
 {name:"DIKSHA",desc:"Indian school learning resources, textbooks and activities.",url:"https://diksha.gov.in/",icon:"🇮🇳"},
 {name:"NCERT ePathshala",desc:"NCERT digital textbooks and educational materials.",url:"https://epathshala.nic.in/",icon:"📚"},
 {name:"PhET Simulations",desc:"Interactive science and mathematics simulations.",url:"https://phet.colorado.edu/",icon:"🧪"},
 {name:"OpenStax",desc:"Free textbooks; check level and licence before reuse.",url:"https://openstax.org/subjects",icon:"📖"},
 {name:"CK-12",desc:"Free STEM learning resources and practice.",url:"https://www.ck12.org/student/",icon:"🔬"},
 {name:"BBC Bitesize",desc:"Subject explanations and revision resources.",url:"https://www.bbc.co.uk/bitesize",icon:"🌐"},
 {name:"Wikimedia Commons",desc:"Media files with individual licences and attribution requirements.",url:"https://commons.wikimedia.org/",icon:"🖼️"}
];
// 150 class/board/subject resource-search cards, not 150 verified standalone courses.
const resources=classes.flatMap(cls=>boards.flatMap(board=>subjects.map(([subject,icon],i)=>({
 id:`${board}-${cls}-${i}`,cls,board,subject,icon,
 title:`${subject} · Class ${cls}`,
 query:`${board} class ${cls} ${subject} free lessons notes textbook`,
 desc:`Find free ${subject} learning materials for ${board}, Class ${cls}.`
}))));
const quizBank=[
 {q:"What is 12 × 8?",o:["86","96","108","92"],a:1,why:"12 × 8 = 96."},
 {q:"Which star is closest to Earth?",o:["Sirius","The Sun","Polaris","Vega"],a:1,why:"The Sun is Earth's nearest star."},
 {q:"Which part of a plant usually absorbs water?",o:["Flower","Leaf","Root","Fruit"],a:2,why:"Roots absorb water and minerals from soil."},
 {q:"What does CPU stand for?",o:["Central Processing Unit","Computer Personal Utility","Core Power Unit","Central Program User"],a:0,why:"CPU stands for Central Processing Unit."},
 {q:"Which gas do plants absorb during photosynthesis?",o:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],a:2,why:"Plants use carbon dioxide, water and light in photosynthesis."},
 {q:"How many sides does a hexagon have?",o:["Five","Six","Seven","Eight"],a:1,why:"A hexagon has six sides."},
 {q:"Which is a renewable energy source?",o:["Coal","Petrol","Solar energy","Natural gas"],a:2,why:"Solar energy is replenished naturally."},
 {q:"What is the capital of India?",o:["Mumbai","Kolkata","New Delhi","Chennai"],a:2,why:"New Delhi is India's capital."},
 {q:"Which number is prime?",o:["21","27","29","33"],a:2,why:"29 has exactly two positive factors: 1 and 29."},
 {q:"Which punctuation ends a direct question?",o:["Comma","Full stop","Question mark","Colon"],a:2,why:"A question mark ends a direct question."},
 {q:"Which organ pumps blood around the body?",o:["Lung","Heart","Kidney","Stomach"],a:1,why:"The heart pumps blood through the circulatory system."},
 {q:"What is H₂O commonly called?",o:["Salt","Oxygen","Water","Hydrogen"],a:2,why:"H₂O is the chemical formula for water."},
 {q:"Which planet is known as the Red Planet?",o:["Venus","Mars","Jupiter","Mercury"],a:1,why:"Iron-rich dust gives Mars its reddish appearance."},
 {q:"What is 15% of 200?",o:["15","20","30","40"],a:2,why:"0.15 × 200 = 30."},
 {q:"What does HTML help define?",o:["Web page structure","Electric current","A database password","A computer's weight"],a:0,why:"HTML describes the structure and content of web pages."}
];
const KEY="vexo20Data";
function loadData(){
 try{return Object.assign({notes:[],tasks:[],done:[],quizRuns:0,best:0,streak:0,name:"Student",dailyGoal:3,flashcards:[
 {front:"What is photosynthesis?",back:"The process plants use to make food using light."},
 {front:"What does CPU stand for?",back:"Central Processing Unit."},
 {front:"What is a prime number?",back:"A whole number greater than 1 with exactly two positive factors."}
 ]},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{return {notes:[],tasks:[],done:[],quizRuns:0,best:0,streak:0,name:"Student",dailyGoal:3,flashcards:[]}}
}
let data=loadData(),page="dashboard",filters={q:"",board:"",cls:"",subject:""},quiz={index:0,score:0,answered:false,questions:[]},flashIndex=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Browser storage is full. Please export or remove some data.")}updateSide()}
function updateSide(){$("#sideProgress").textContent=data.done.length+" lessons completed";$("#avatar").textContent=(data.name||"S").trim().charAt(0).toUpperCase()}
function go(p){page=p;$$(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#sidebar").classList.remove("open");render();window.scrollTo({top:0,behavior:"smooth"})}
function pageHead(kicker,title,sub=""){return `<div class="eyebrow">${kicker}</div><h2>${title}</h2>${sub?`<p class="muted">${sub}</p>`:""}`}
function dashboard(){return `
<section class="hero"><div class="eyebrow">WELCOME TO VEXO 2.0</div><h2>Learn smarter.<br><span class="gradient">Go beyond limits.</span></h2><p>Your learning space for free educational resources, personal notes, quick quizzes and a better study routine.</p><div class="actions"><button class="btn primary" data-go="courses">Explore course library ↗</button><button class="btn teal" data-go="quiz">Take a quick quiz</button></div></section>
<div class="stats">
 <div class="stat"><div class="label">RESOURCE SEARCH CARDS</div><div class="num">${resources.length}+</div><div class="small muted">Class, board and subject combinations</div></div>
 <div class="stat"><div class="label">LESSONS COMPLETED</div><div class="num">${data.done.length}</div><div class="small muted">Your saved learning progress</div></div>
 <div class="stat"><div class="label">QUIZ ATTEMPTS</div><div class="num">${data.quizRuns}</div><div class="small muted">Keep practising</div></div>
 <div class="stat"><div class="label">BEST QUIZ SCORE</div><div class="num">${data.best}%</div><div class="small muted">Personal best</div></div>
</div>
<div class="section-head"><div><h3>Continue your learning</h3><div class="muted small">Jump back into your favourite tools.</div></div></div>
<div class="grid three">
 <article class="card"><div class="card-top"><div class="iconbox">📚</div><span class="tag">Explore</span></div><h3>Course Library</h3><p class="muted small">Find subject and class-specific free learning resources.</p><button class="btn" data-go="courses">Browse resources →</button></article>
 <article class="card"><div class="card-top"><div class="iconbox">📝</div><span class="tag">Personal</span></div><h3>My Notes</h3><p class="muted small">${data.notes.length} saved notes. Write your own summaries.</p><button class="btn" data-go="notes">Open notes →</button></article>
 <article class="card"><div class="card-top"><div class="iconbox">🧠</div><span class="tag">Practice</span></div><h3>Quick Quiz</h3><p class="muted small">Test general knowledge and review explanations.</p><button class="btn" data-go="quiz">Start quiz →</button></article>
</div>
<div class="section-head"><div><h3>Free learning platforms</h3><div class="muted small">Open a source to explore its own content and branding.</div></div><button class="btn ghost" data-go="sources">View all →</button></div>
<div class="grid four">${sourceList.slice(0,4).map(s=>`<article class="card"><div class="iconbox">${s.icon}</div><h3 style="margin-top:12px">${esc(s.name)}</h3><p class="muted small">${esc(s.desc)}</p><a href="${s.url}" target="_blank" rel="noopener noreferrer">Visit source ↗</a></article>`).join("")}</div>`}
function coursePage(){
 const list=resources.filter(r=>(!filters.q||(r.title+" "+r.query).toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.board||r.board===filters.board)&&(!filters.cls||r.cls===Number(filters.cls))&&(!filters.subject||r.subject===filters.subject));
 return `${pageHead("RESOURCE DISCOVERY","Free Course Library","Browse class and subject combinations, then search the web for suitable free learning material. These cards are discovery shortcuts, not individually verified courses.")}
 <div class="notice">ℹ️ External resources open on their original websites. Always check the source, syllabus match and reuse licence. Search results can include paid or unsuitable items, so check before using.</div>
 <div class="toolbar"><input class="field" id="resQuery" placeholder="Search subject or topic..." value="${esc(filters.q)}"><select class="field" id="resBoard"><option value="">All boards</option>${boards.map(b=>`<option ${filters.board===b?"selected":""}>${b}</option>`).join("")}</select><select class="field" id="resClass"><option value="">All classes</option>${classes.map(n=>`<option value="${n}" ${Number(filters.cls)===n?"selected":""}>Class ${n}</option>`).join("")}</select><select class="field" id="resSubject"><option value="">All subjects</option>${subjects.map(([s])=>`<option ${filters.subject===s?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
 <p class="muted small">${list.length} resource discovery cards · ${resources.length} total combinations</p>
 <div class="grid three">${list.slice(0,90).map(r=>`<article class="card"><div class="card-top"><div class="iconbox">${r.icon}</div><span class="tag">${r.board} · Class ${r.cls}</span></div><h3>${esc(r.title)}</h3><p class="muted small">${esc(r.desc)}</p><div class="resource-link"><span class="small muted">${esc(r.subject)}</span><a target="_blank" rel="noopener noreferrer" href="${googleSearch(r.query)}">Find free resources ↗</a></div><hr><button class="btn ghost" data-mark="${esc(r.id)}">${data.done.includes(r.id)?"✓ Marked explored":"Mark explored"}</button></article>`).join("")}</div>
 ${list.length>90?`<p class="muted small">Showing the first 90 matching cards. Narrow your search to find more.</p>`:""}`;
}
function googleSearch(q){return "https://www.google.com/search?q="+encodeURIComponent(q+" free educational resources");}
function sourcesPage(){return `${pageHead("OPEN LEARNING","Free Sources","These are external educational platforms. VEXO does not own their content. Availability, age suitability and licence terms vary by resource.")}
<div class="grid two">${sourceList.map(s=>`<article class="card"><div class="card-top"><div class="iconbox">${s.icon}</div><span class="tag">External source</span></div><h3>${esc(s.name)}</h3><p class="muted">${esc(s.desc)}</p><a class="btn primary" style="display:inline-block;margin-top:12px" href="${s.url}" target="_blank" rel="noopener noreferrer">Open original website ↗</a></article>`).join("")}</div>
<div class="notice"><b>Attribution reminder:</b> Linking to a source is different from copying its content. Before copying, downloading, embedding or redistributing a resource, read the resource's specific licence and the site's terms.</div>`}
function notesPage(){return `${pageHead("YOUR KNOWLEDGE","My Notes","Write your own summaries and keep them saved in this browser.")}
<div class="card"><h3>Create a note</h3><input class="field" id="noteTitle" placeholder="Note title (e.g. Class 8 — Algebra)" maxlength="120" style="margin:8px 0"><textarea class="field" id="noteBody" placeholder="Write your notes here..." maxlength="15000"></textarea><div class="actions"><button class="btn primary" id="saveNote">Save note</button><button class="btn" id="clearNote">Clear</button></div></div>
<div class="section-head"><h3>Saved notes (${data.notes.length})</h3></div>
${data.notes.length?`<div class="list">${data.notes.map((n,i)=>`<article class="list-item"><div style="flex:1;min-width:0"><b>${esc(n.title)}</b><p class="muted small">${esc(n.body.slice(0,230))}${n.body.length>230?"…":""}</p><span class="small muted">${esc(n.date)}</span><div class="actions"><button class="btn" data-editnote="${i}">Edit</button><button class="btn" data-delnote="${i}">Delete</button></div></div></article>`).join("")}</div>`:`<div class="empty">No notes yet. Create your first note above.</div>`}`}
function quizPage(){if(!quiz.questions.length){return `${pageHead("PRACTICE ZONE","Quiz & Tests","Answer the questions and read the explanations to strengthen your knowledge.")}<div class="card"><div class="iconbox">🧠</div><h3 style="margin-top:12px">General knowledge quiz</h3><p class="muted">15 mixed questions. Your best score is saved in this browser.</p><button class="btn primary" id="startQuiz">Start quiz →</button></div>`}
 const q=quiz.questions[quiz.index];if(!q)return `${pageHead("QUIZ COMPLETE","Great work!")}<div class="card"><div class="num" style="font-size:40px">${Math.round(quiz.score/quiz.questions.length*100)}%</div><p>You got ${quiz.score} out of ${quiz.questions.length} correct.</p><button class="btn primary" id="restartQuiz">Try again</button> <button class="btn" data-go="progress">View progress</button></div>`;
 return `${pageHead("QUESTION "+(quiz.index+1)+" OF "+quiz.questions.length,"Take your time.","Choose one answer. You will see an explanation after answering.")}<div class="progress"><span style="width:${quiz.index/quiz.questions.length*100}%"></span></div><div class="card"><h3>${esc(q.q)}</h3>${q.o.map((o,i)=>`<button class="quiz-option ${quiz.answered&&i===q.a?"correct":""} ${quiz.answered&&i===quiz.chosen&&i!==q.a?"wrong":""}" data-answer="${i}" ${quiz.answered?"disabled":""}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}${quiz.answered?`<div class="notice">${quiz.chosen===q.a?"✓ Correct!":"Not quite."} ${esc(q.why)}</div><button class="btn primary" id="nextQuestion">${quiz.index===quiz.questions.length-1?"See results":"Next question →"}</button>`:""}</div>`;
}
function flashPage(){if(!data.flashcards.length)return `${pageHead("MEMORY LAB","Flashcards")}<div class="empty">No flashcards yet. Add one below.</div>`;const f=data.flashcards[flashIndex%data.flashcards.length];return `${pageHead("MEMORY LAB","Flashcards","Tap reveal to check your answer. Create your own cards for revision.")}<div class="card" style="max-width:650px;margin:auto;text-align:center;padding:30px"><span class="tag">CARD ${(flashIndex%data.flashcards.length)+1} / ${data.flashcards.length}</span><h2 id="flashText" style="font-size:25px;margin:30px 0">${esc(f.front)}</h2><p id="flashAnswer" class="muted hidden">${esc(f.back)}</p><button class="btn primary" id="revealFlash">Reveal answer</button><div class="actions" style="justify-content:center"><button class="btn" id="prevFlash">← Previous</button><button class="btn" id="nextFlash">Next →</button></div></div><div class="card" style="margin-top:14px"><h3>Add a flashcard</h3><input class="field" id="flashFront" placeholder="Question or term" maxlength="300" style="margin:8px 0"><textarea class="field" id="flashBack" placeholder="Answer or definition" maxlength="500" style="min-height:80px"></textarea><button class="btn primary" id="addFlash" style="margin-top:10px">Add card</button></div>`}
function plannerPage(){return `${pageHead("BUILD A ROUTINE","Study Planner","Add tasks, tick them off and keep your plan saved on this device.")}<div class="card"><h3>Add a study task</h3><div class="toolbar"><input class="field" id="taskText" placeholder="e.g. Revise fractions for 20 minutes" maxlength="180"><input class="field" id="taskDate" type="date"><button class="btn primary" id="addTask">Add task +</button></div></div><div class="section-head"><h3>Your tasks (${data.tasks.length})</h3><button class="btn ghost" id="clearDoneTasks">Clear completed</button></div>${data.tasks.length?`<div class="list">${data.tasks.map((t,i)=>`<label class="list-item"><input type="checkbox" data-task="${i}" ${t.done?"checked":""}><span style="flex:1"><b style="${t.done?"text-decoration:line-through;opacity:.6":""}">${esc(t.text)}</b><div class="muted small">${esc(t.date||"No due date")}</div></span><button class="btn" data-deltask="${i}" type="button">Delete</button></label>`).join("")}</div>`:`<div class="empty">Your study plan is empty. Add your first task.</div>`}`}
function progressPage(){const tasksDone=data.tasks.filter(t=>t.done).length;return `${pageHead("YOUR JOURNEY","Progress","A simple summary of the work saved in this browser.")}<div class="stats"><div class="stat"><div class="label">EXPLORED RESOURCES</div><div class="num">${data.done.length}</div></div><div class="stat"><div class="label">NOTES WRITTEN</div><div class="num">${data.notes.length}</div></div><div class="stat"><div class="label">QUIZ ATTEMPTS</div><div class="num">${data.quizRuns}</div></div><div class="stat"><div class="label">TASKS COMPLETED</div><div class="num">${tasksDone}</div></div></div><div class="card"><h3>Study goal</h3><p class="muted">Your daily goal is ${data.dailyGoal} completed study tasks.</p><div class="progress"><span style="width:${Math.min(100,tasksDone/Math.max(1,data.dailyGoal)*100)}%"></span></div><p class="small muted">${tasksDone} completed tasks recorded overall. This is not a daily reset counter.</p><button class="btn" data-go="planner">Open study planner</button></div><div class="card" style="margin-top:14px"><h3>Best quiz result</h3><div class="num" style="font-size:34px">${data.best}%</div><p class="muted small">Your highest score saved on this device.</p><button class="btn" data-go="quiz">Practise again</button></div>`}
function aiPage(){return `${pageHead("AI STUDY HUB","Your AI study companions","Open a separate AI service for explanations, revision plans or practice questions.")}
<div class="notice">These links open third-party AI services. Their availability, sign-in rules, age requirements and terms are controlled by each provider. Do not share passwords or private information.</div><div class="grid two"><article class="card"><div class="iconbox">✧</div><h3 style="margin-top:12px">ChatGPT</h3><p class="muted">Ask for explanations, examples and study support.</p><a class="btn primary" style="display:inline-block" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT ↗</a></article><article class="card"><div class="iconbox">✦</div><h3 style="margin-top:12px">Google Gemini</h3><p class="muted">Explore ideas and ask questions about your lessons.</p><a class="btn primary" style="display:inline-block" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Open Gemini ↗</a></article></div>`}
function settingsPage(){return `${pageHead("PERSONALISE VEXO","Settings","Your name and study preferences are stored in this browser.")}<div class="card"><h3>Student profile</h3><label class="small muted" for="studentName">Display name</label><input id="studentName" class="field" maxlength="40" value="${esc(data.name)}" style="margin:7px 0 15px"><label class="small muted" for="dailyGoal">Daily study goal (tasks)</label><select class="field" id="dailyGoal" style="margin:7px 0 15px">${[1,2,3,4,5,6,8,10].map(n=>`<option value="${n}" ${data.dailyGoal===n?"selected":""}>${n} tasks</option>`).join("")}</select><div class="actions"><button class="btn primary" id="saveSettings">Save settings</button><button class="btn" id="exportData">Export my data</button><button class="btn" id="importBtn">Import data</button><input id="importFile" class="hidden" type="file" accept="application/json"></div></div><div class="card" style="margin-top:14px"><h3>Local data</h3><p class="muted small">Notes, tasks, flashcards and progress are stored in this browser using localStorage. They do not automatically sync to another device. Export a backup before clearing browser data.</p><button class="btn" id="resetData" style="border-color:#7d3c58;color:#ffb5c3">Reset all VEXO data</button></div>`}
function render(){updateSide();const views={dashboard,courses:coursePage,notes:notesPage,quiz:quizPage,flashcards:flashPage,planner:plannerPage,progress:progressPage,sources:sourcesPage,ai:aiPage,settings:settingsPage};$("#content").innerHTML=(views[page]||dashboard)();bindPage();$$(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function bindPage(){
 const bind=(id,event,fn)=>{const el=$("#"+id);if(el)el.addEventListener(event,fn)};
 bind("resQuery","input",e=>{filters.q=e.target.value;const pos=e.target.selectionStart;render();const el=$("#resQuery");el.focus();el.setSelectionRange(pos,pos)});
 bind("resBoard","change",e=>{filters.board=e.target.value;render()});
 bind("resClass","change",e=>{filters.cls=e.target.value;render()});
 bind("resSubject","change",e=>{filters.subject=e.target.value;render()});
 bind("saveNote","click",()=>{const title=$("#noteTitle").value.trim(),body=$("#noteBody").value.trim();if(!title||!body)return alert("Add a title and note content first.");data.notes.unshift({title,body,date:new Date().toLocaleDateString()});save();render()});
 bind("clearNote","click",()=>{$("#noteTitle").value="";$("#noteBody").value=""});
 bind("startQuiz","click",startQuiz);bind("restartQuiz","click",startQuiz);
 bind("nextQuestion","click",()=>{quiz.index++;quiz.answered=false;render()});
 bind("revealFlash","click",()=>{$("#flashAnswer").classList.toggle("hidden");$("#revealFlash").textContent=$("#flashAnswer").classList.contains("hidden")?"Reveal answer":"Hide answer"});
 bind("prevFlash","click",()=>{flashIndex=(flashIndex-1+data.flashcards.length)%data.flashcards.length;render()});
 bind("nextFlash","click",()=>{flashIndex=(flashIndex+1)%data.flashcards.length;render()});
 bind("addFlash","click",()=>{const front=$("#flashFront").value.trim(),back=$("#flashBack").value.trim();if(!front||!back)return alert("Add both a question and answer.");data.flashcards.push({front,back});save();flashIndex=data.flashcards.length-1;render()});
 bind("addTask","click",()=>{const text=$("#taskText").value.trim();if(!text)return alert("Write a task first.");data.tasks.push({text,date:$("#taskDate").value,done:false});save();render()});
 bind("clearDoneTasks","click",()=>{data.tasks=data.tasks.filter(t=>!t.done);save();render()});
 bind("saveSettings","click",()=>{data.name=$("#studentName").value.trim()||"Student";data.dailyGoal=Number($("#dailyGoal").value)||3;save();alert("Settings saved.");render()});
 bind("exportData","click",exportData);
 bind("importBtn","click",()=>$("#importFile").click());
 bind("importFile","change",importData);
 bind("resetData","click",()=>{if(confirm("Delete all saved VEXO notes, tasks and progress from this browser? Export a backup first if needed.")){localStorage.removeItem(KEY);data=loadData();filters={q:"",board:"",cls:"",subject:""};render()}});
 $$("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
 $$("[data-mark]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.mark;data.done=data.done.includes(id)?data.done.filter(x=>x!==id):[...data.done,id];save();render()}));
 $$("[data-answer]").forEach(b=>b.addEventListener("click",()=>{if(quiz.answered)return;quiz.chosen=Number(b.dataset.answer);quiz.answered=true;if(quiz.chosen===quiz.questions[quiz.index].a)quiz.score++;render()}));
 $$("[data-editnote]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.editnote),n=data.notes[i];$("#noteTitle").value=n.title;$("#noteBody").value=n.body;data.notes.splice(i,1);save();window.scrollTo({top:0,behavior:"smooth"})}));
 $$("[data-delnote]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete this note?")){data.notes.splice(Number(b.dataset.delnote),1);save();render()}}));
 $$("[data-task]").forEach(b=>b.addEventListener("change",()=>{data.tasks[Number(b.dataset.task)].done=b.checked;save();render()}));
 $$("[data-deltask]").forEach(b=>b.addEventListener("click",()=>{data.tasks.splice(Number(b.dataset.deltask),1);save();render()}));
}
function startQuiz(){quiz={index:0,score:0,answered:false,chosen:null,questions:[...quizBank].sort(()=>Math.random()-.5)};go("quiz")}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="vexo-backup.json";a.click();URL.revokeObjectURL(url)}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!incoming||typeof incoming!=="object"||!Array.isArray(incoming.notes)||!Array.isArray(incoming.tasks))throw Error();if(confirm("Import this backup and replace current VEXO data?")){data=Object.assign(data,incoming);save();render();alert("Backup imported.")}}catch{alert("That file is not a valid VEXO backup.")}e.target.value=""};reader.readAsText(file)}
$$(".nav").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
$("#menuBtn").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
$("#today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#sidebar").classList.remove("open")});
updateSide();render();
</script>
</body>
</html>
