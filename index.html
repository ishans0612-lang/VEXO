
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11152b">
<meta name="description" content="VEXO — Learn Beyond Limits. Explore free educational games, online study tools, courses, quizzes, flashcards and study planning.">
<meta name="keywords" content="free educational games, learning app, online study games, free online courses, study notes, quizzes, flashcards, VEXO">
<meta name="author" content="VEXO">
<title>VEXO — Learn Beyond Limits</title>
<style>
:root{
 --bg:#0b1020;--panel:#141b30;--panel2:#1b2540;--text:#f3f5ff;
 --muted:#a4aec9;--accent:#9b87ff;--accent2:#36d9c4;--border:#2b3653;
 --radius:18px;--font:Inter,system-ui,-apple-system,sans-serif;--scale:1;
 --sidebar:260px;--space:16px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
font-size:calc(15px * var(--scale));line-height:1.55;transition:.2s}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
a{color:var(--accent2)}
.layout{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 22px;font-size:24px;font-weight:900;letter-spacing:1px}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#101528;font-weight:1000}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}
.nav-label{color:var(--muted);font-size:10px;letter-spacing:2px;margin:15px 10px 7px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;margin:2px 0}
.nav:hover,.nav.active{background:var(--panel2);color:var(--text)}
.nav.active{box-shadow:inset 3px 0 var(--accent2)}
.side-bottom{border-top:1px solid var(--border);margin-top:18px;padding-top:15px}
.main{min-width:0;padding:24px clamp(14px,3vw,38px) 50px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.topbar h1{font-size:clamp(22px,3vw,32px);margin:0}
.topbar p{color:var(--muted);margin:4px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:11px}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:#101326;border-color:transparent;font-weight:750}
.btn.good{background:var(--accent2);color:#081a20;border-color:transparent;font-weight:750}
.btn.danger{color:#ff9eae}
.hero{padding:clamp(22px,4vw,38px);border-radius:24px;background:linear-gradient(120deg,#342a68,#173b51);border:1px solid var(--border);margin-bottom:22px}
.hero h2{font-size:clamp(25px,4vw,40px);line-height:1.15;margin:8px 0 12px;max-width:650px}
.hero p{color:#d8dcf5;max-width:650px}
.eyebrow{color:var(--accent2);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space);margin:18px 0 26px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;min-width:0}
.card h3{font-size:16px;margin:8px 0}
.card p{color:var(--muted);margin:6px 0}
.metric{font-size:29px;font-weight:850;letter-spacing:-1px;margin-top:8px}
.icon{font-size:24px}
.muted{color:var(--muted)}
.small{font-size:12px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:28px 0 12px}
.section-head h2{font-size:21px;margin:0}
.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.field{width:100%;min-width:0;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:10px}
.searchbar .field{flex:1;min-width:180px}
textarea.field{min-height:100px;resize:vertical}
select.field{cursor:pointer}
.progress{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;margin:12px 0}
.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:100px;padding:3px 9px;font-size:11px;color:var(--muted);margin:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.list-item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.list-item>div:first-child{flex:1;min-width:0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.lesson-content{white-space:pre-wrap;line-height:1.85}
.notice{border:1px solid var(--border);padding:13px;border-radius:12px;background:var(--panel2);margin:12px 0}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}
label{display:block;margin:8px 0;color:var(--muted);font-size:13px}
input[type=checkbox]{accent-color:var(--accent)}
input[type=color]{height:42px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:28px}
.mobile-menu{display:none}
.hidden{display:none!important}
button:disabled{opacity:.45;cursor:not-allowed}
body.light{--bg:#f3f5fc;--panel:#fff;--panel2:#edf0fa;--text:#1a2035;--muted:#606b84;--border:#dce1ef}
body.compact{--space:9px}
body.rounded{--radius:28px}
body.sharp{--radius:5px}
body.large-text{--scale:1.12}
body.serif{--font:Georgia,"Times New Roman",serif}
body.mono{--font:ui-monospace,SFMono-Regular,monospace}
body.no-motion *{transition:none!important;animation:none!important}
body.no-border .card,body.no-border .sidebar{border-color:transparent}
body.wide .layout{grid-template-columns:210px minmax(0,1fr)}
body.centered .main{max-width:1250px;margin:auto;width:100%}
body.high-contrast{--muted:#e3e7ff;--border:#65708d}
body.gradient .hero{background:linear-gradient(120deg,#512f82,#087e82)}
body.warm{--accent:#ffb36c;--accent2:#f5d17b}
body.ocean{--accent:#65b9ff;--accent2:#53e5d0}
body.rose{--accent:#ff8eb7;--accent2:#d8a4ff}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){
 .layout{grid-template-columns:1fr}
 .sidebar{position:fixed;left:-290px;z-index:20;width:270px;transition:left .2s;box-shadow:0 0 40px #0008}
 .sidebar.open{left:0}
 .mobile-menu{display:inline-block}
 .main{padding:16px 13px 35px}
 .grid,.grid.two,.grid.three{grid-template-columns:1fr}
 .hero{padding:23px}
 .metric{font-size:25px}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">V</div><div>VEXO<small>LEARN BEYOND LIMITS</small></div></div>
  <div class="nav-label">WORKSPACE</div>
  <nav id="navigation">
    <button class="nav active" data-page="dashboard">⌂ <span data-i18n="Dashboard">Dashboard</span></button>
    <button class="nav" data-page="notes">▤ <span data-i18n="My Notes">My Notes</span></button>
    <button class="nav" data-page="courses">▣ <span data-i18n="Courses">Courses</span></button>
    <button class="nav" data-page="lessons">▹ Lessons</button>
    <button class="nav" data-page="quiz">✎ Quiz &amp; Tests</button>
    <button class="nav" data-page="flashcards">▤ Flashcards</button>
    <button class="nav" data-page="games">♟ Educational Games</button>
    <button class="nav" data-page="planner">▦ Study Planner</button>
    <button class="nav" data-page="progress">◴ Progress</button>
    <button class="nav" data-page="doubts">❔ Doubt Room</button>
    <button class="nav" data-page="ai">✦ AI Study Hub</button>
    <button class="nav" data-page="certificates">♜ Certificates</button>
    <button class="nav" data-page="notifications">♧ Notifications</button>
    <button class="nav" data-page="guardian">⌂ Guardian Dashboard</button>
  </nav>
  <div class="nav-label">PERSONAL</div>
  <button class="nav" data-page="customize">⚙ Customize VEXO</button>
  <button class="nav" data-page="account">♙ Account / Guest</button>
  <button class="nav" data-page="settings">☷ Settings</button>
  <div class="side-bottom small muted">VEXO • Study smarter every day</div>
</aside>
<main class="main">
<header class="topbar">
  <div class="row">
    <button class="btn mobile-menu" id="menuButton" aria-label="Open menu">☰</button>
    <div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Your learning space, your pace.</p></div>
  </div>
  <div class="actions">
    <select class="field" id="languageSelect" aria-label="Interface language" style="width:auto;max-width:190px"></select>
    <button class="btn" id="quickGuest">♙ Guest</button>
  </div>
</header>
<div id="app"></div>
<footer class="footer">VEXO © 2026 • Learn Beyond Limits • Keep learning, keep growing.</footer>
</main>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LANGUAGES=[
["en","English"],["as","অসমীয়া"],["bn","বাংলা"],["brx","बड़ो"],["doi","डोगरी"],
["gu","ગુજરાતી"],["hi","हिन्दी"],["kn","ಕನ್ನಡ"],["ks","کٲشُر"],["kok","कोंकणी"],
["mai","मैथिली"],["ml","മലയാളം"],["mni","মেইতেই"],["mr","मराठी"],["ne","नेपाली"],
["or","ଓଡ଼ିଆ"],["pa","ਪੰਜਾਬੀ"],["sa","संस्कृतम्"],["sat","ᱥᱟᱱᱛᱟᱲᱤ"],
["sd","سنڌي"],["ta","தமிழ்"],["te","తెలుగు"],["ur","اردو"]
];
const TRANSLATIONS={
en:{Dashboard:"Dashboard","My Notes":"My Notes",Courses:"Courses",Search:"Search",Save:"Save",Guest:"Guest"},
bn:{Dashboard:"ড্যাশবোর্ড","My Notes":"আমার নোট",Courses:"কোর্স",Search:"খুঁজুন",Save:"সেভ করুন",Guest:"গেস্ট"},
hi:{Dashboard:"डैशबोर्ड","My Notes":"मेरे नोट्स",Courses:"कोर्स",Search:"खोजें",Save:"सेव करें",Guest:"अतिथि"},
ta:{Dashboard:"முகப்பு","My Notes":"என் குறிப்புகள்",Courses:"பாடநெறிகள்",Search:"தேடு",Save:"சேமி",Guest:"விருந்தினர்"},
te:{Dashboard:"డాష్‌బోర్డ్","My Notes":"నా నోట్స్",Courses:"కోర్సులు",Search:"వెతకండి",Save:"సేవ్",Guest:"అతిథి"},
gu:{Dashboard:"ડેશબોર્ડ","My Notes":"મારી નોંધો",Courses:"કોર્સ",Search:"શોધો",Save:"સાચવો",Guest:"મહેમાન"},
mr:{Dashboard:"डॅशबोर्ड","My Notes":"माझ्या नोंदी",Courses:"अभ्यासक्रम",Search:"शोधा",Save:"जतन करा",Guest:"अतिथी"},
pa:{Dashboard:"ਡੈਸ਼ਬੋਰਡ","My Notes":"ਮੇਰੇ ਨੋਟਸ",Courses:"ਕੋਰਸ",Search:"ਖੋਜੋ",Save:"ਸੇਵ",Guest:"ਮਹਿਮਾਨ"}
};
const SUBJECTS=[
["Mathematics","🔢"],["Science","🔬"],["English","📚"],["Computer Science","💻"],
["Physics","⚛️"],["Chemistry","🧪"],["Biology","🌱"],["History","🏛️"],
["Geography","🌍"],["Civics","⚖️"],["Economics","📈"],["General Knowledge","🧠"],
["Environmental Science","🌿"],["Art & Design","🎨"],["Logical Reasoning","🧩"],
["Coding","⌨️"],["Astronomy","🪐"],["Financial Literacy","💰"],["Health Education","❤️"],
["Communication","💬"]
];

const BOARDS = ["WBBSE", "CBSE", "ICSE"];
const CLASSES = [6, 7, 8, 9, 10];

const COURSES = CLASSES.flatMap(classNo =>
  BOARDS.flatMap(board =>
    SUBJECTS.map((subject, index) => ({
      id: `c-${board}-${classNo}-${index + 1}`,
      title: `${subject[0]} — Class ${classNo}`,
      subject: subject[0],
      icon: subject[1],
      level: classNo <= 7 ? "Beginner" :
             classNo <= 9 ? "Intermediate" : "Foundation",
      board,
      classNo,
      lessons: 3,
      description:
        `${board} Class ${classNo}: ${subject[0]} study course with lessons and practice.`
    }))
  )
);

const GAMES=Array.from({length:120},(_,i)=>{
 const s=SUBJECTS[i%SUBJECTS.length];
 const formats=["Quick Quiz","Memory Challenge","Word Match","Brain Trainer","Speed Round","Knowledge Quest"];
 return {id:"g"+(i+1),title:s[0]+" "+formats[Math.floor(i/SUBJECTS.length)%formats.length]+" "+(Math.floor(i/SUBJECTS.length)+1),subject:s[0],icon:["🎯","🧠","🧩","🚀","⭐","🎮"][i%6]};
});
const DEFAULT={
notes:[],completed:[],answers:0,correct:0,streak:0,plans:[],flashcards:[
{q:"What is photosynthesis?",a:"The process plants use to convert light into chemical energy."},
{q:"What is 7 × 8?",a:"56."},
{q:"What does CPU stand for?",a:"Central Processing Unit."}
],history:[],quizScore:0,quizTotal:0,studySeconds:0,activeSince:Date.now(),
lastDate:new Date().toDateString(),displayName:"Guest",account:null,guest:true,language:"en",
settings:{theme:"default",accent:"#9b87ff",accent2:"#36d9c4",font:"system",scale:1,space:"normal",radius:"normal",layout:"normal",motion:true,borders:true,contrast:false,gradient:false,sidebar:260},
notifications:["Welcome to VEXO! Your learning journey starts here."],dailyGoal:30,lesson:null,game:null
};
let data;
try{data={...DEFAULT,...JSON.parse(localStorage.getItem("vexoData")||"{}")};data.settings={...DEFAULT.settings,...data.settings};}
catch(e){data={...DEFAULT};}
let currentPage="dashboard",courseFilter="",courseQuery="",gameQuery="",quizIndex=0,quizQuestions=[],gamePoints=0;
function save(){
 try{localStorage.setItem("vexoData",JSON.stringify(data));}
 catch(e){toast("Storage is full. Please export your data and remove some old content.");}
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;background:var(--panel2);border:1px solid var(--border);padding:12px 18px;border-radius:12px;max-width:90%;";document.body.append(el);}el.textContent=msg;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,2600);}
function fmtTime(n){let m=Math.floor(n/60);return m<60?m+" min":Math.floor(m/60)+" h "+m%60+" min";}
function recordPage(p){
 data.history.unshift({page:p,time:new Date().toISOString()});
 data.history=data.history.slice(0,100);
 save();
}
function applySettings(){
 const s=data.settings;
 document.body.classList.toggle("light",s.theme==="light");
 ["compact","rounded","sharp","large-text","serif","mono","no-motion","no-border","wide","centered","high-contrast","gradient","warm","ocean","rose"].forEach(c=>document.body.classList.remove(c));
 if(s.space==="compact")document.body.classList.add("compact");
 if(s.radius==="round")document.body.classList.add("rounded");
 if(s.radius==="sharp")document.body.classList.add("sharp");
 if(+s.scale>1)document.body.classList.add("large-text");
 if(s.font==="serif")document.body.classList.add("serif");
 if(s.font==="mono")document.body.classList.add("mono");
 if(!s.motion)document.body.classList.add("no-motion");
 if(!s.borders)document.body.classList.add("no-border");
 if(s.layout==="wide")document.body.classList.add("wide");
 if(s.layout==="centered")document.body.classList.add("centered");
 if(s.contrast)document.body.classList.add("high-contrast");
 if(s.gradient)document.body.classList.add("gradient");
 if(["warm","ocean","rose"].includes(s.theme))document.body.classList.add(s.theme);
 document.documentElement.style.setProperty("--accent",s.accent||"#9b87ff");
 document.documentElement.style.setProperty("--accent2",s.accent2||"#36d9c4");
 document.documentElement.style.setProperty("--space",s.space==="compact"?"9px":"16px");
 document.documentElement.style.setProperty("--sidebar",(s.sidebar||260)+"px");
}
function setSetting(k,v){data.settings[k]=v;save();applySettings();render();}
function tr(s){const d=TRANSLATIONS[data.language]||TRANSLATIONS.en;return d[s]||s;}
function setLanguage(v){data.language=v;save();render();}
function optionList(arr,val){return arr.map(([v,l])=>`<option value="${esc(v)}" ${v===val?"selected":""}>${esc(l)}</option>`).join("");}
$("#languageSelect").innerHTML=LANGUAGES.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("");
$("#languageSelect").value=data.language;
$("#languageSelect").addEventListener("change",e=>setLanguage(e.target.value));
$("#sidebar").addEventListener("click",e=>{
 const b=e.target.closest("[data-page]");if(b)navigate(b.dataset.page);
});
$("#menuButton").onclick=()=>$("#sidebar").classList.toggle("open");
$("#quickGuest").onclick=()=>{data.guest=true;data.displayName="Guest";save();toast("You are using VEXO as a guest.");render();};
function navigate(p){
 currentPage=p;recordPage(p);$("#sidebar").classList.remove("open");
 $$(".nav[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
 render();window.scrollTo({top:0,behavior:data.settings.motion?"smooth":"instant"});
}
function titleFor(p){return ({
dashboard:"Dashboard",notes:"My Notes",courses:"Courses",lessons:"Lessons",
quiz:"Quiz & Tests",flashcards:"Flashcards",games:"Educational Games",planner:"Study Planner",
progress:"Your Progress",doubts:"Doubt Room",ai:"AI Study Hub",certificates:"Certificates",
notifications:"Notifications",guardian:"Guardian Dashboard",customize:"Customize VEXO",
account:"Account & Guest Mode",settings:"Settings"
})[p]||"VEXO";}
function shell(sub,html){$("#pageTitle").textContent=titleFor(currentPage);$("#pageSubtitle").textContent=sub;$("#app").innerHTML=html;}
function card(icon,title,desc,action,label="Open"){
 return `<article class="card"><div class="icon">${icon}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p><button class="btn" data-go="${action}">${label} →</button></article>`;
}
function metric(icon,title,value,desc){return `<article class="card"><div class="row"><span class="icon">${icon}</span><span class="tag">${esc(title)}</span></div><div class="metric">${esc(value)}</div><p>${esc(desc)}</p></article>`;}
function dashboard(){
 const done=data.completed.length,mins=Math.floor(data.studySeconds/60);
 const pct=Math.min(100,Math.round(done/Math.max(1,COURSES.length*3)*100));
 return `<section class="hero"><span class="eyebrow">YOUR PERSONAL LEARNING SPACE</span>
 <h2>Learn beyond limits.<br>Grow every single day.</h2>
 <p>Welcome, ${esc(data.displayName||"Learner")}. Discover new skills, practise what you learn, and build a routine that works for you.</p>
 <div class="actions"><button class="btn good" data-go="courses">Explore courses →</button><button class="btn" data-go="quiz">Start a quiz</button><button class="btn" data-go="games">Play & learn</button></div>
 </section>
 <div class="grid">${metric("📚","Courses available",COURSES.length,"Explore all subjects")}
 ${metric("🎮","Game activities",GAMES.length,"Educational game catalogue")}
 ${metric("⏱️","Study time",fmtTime(mins*60),"Tracked on this device")}
 ${metric("🏆","Lessons completed",done,"Keep building your progress")}</div>
 <div class="section-head"><h2>Pick up where you left off</h2><button class="btn" data-go="progress">View progress</button></div>
 <div class="grid three">${card("📘","Browse courses","Short lessons across many subjects.","courses")}
 ${card("🧠","Test your knowledge","Take a multiple-choice practice quiz.","quiz")}
 ${card("🗓️","Plan your study","Set a realistic learning target.","planner")}</div>
 <div class="section-head"><h2>Today's learning target</h2></div>
 <div class="card"><div class="row"><div><h3>${data.dailyGoal} minutes a day</h3><p>Consistency matters more than one long session.</p></div><button class="btn" data-go="settings">Change goal</button></div>
 <div class="progress"><span style="width:${Math.min(100,Math.round(mins/Math.max(1,data.dailyGoal)*100))}%"></span></div><p class="small muted">${mins} of ${data.dailyGoal} minutes tracked in this browser.</p></div>`;
}

function coursesPage(){
 const list = COURSES.filter(c =>
   (c.title + " " + c.subject + " " + c.level + " " + c.board + " " + c.classNo)
     .toLowerCase().includes(courseQuery.toLowerCase()) &&
   (!courseBoardFilter || c.board === courseBoardFilter) &&
   (!courseClassFilter || c.classNo === Number(courseClassFilter)) &&
   (!courseLevelFilter || c.level === courseLevelFilter)
 );

 return `<div class="notice">
 Choose your board and class to find courses. Lesson content is introductory and is not an official textbook.
 </div>

 <div class="searchbar">
   <input id="courseSearch" class="field"
     placeholder="Search courses or subjects..."
     value="${esc(courseQuery)}">

 if(e.target.id==="gameSearch"){gameQuery=e.target.value;const pos=e.target.selectionStart;render();const el=$("#gameSearch");el?.focus();el?.setSelectionRange(pos,pos);}
});
$("#app").addEventListener("change",e=>{
 if(e.target.id==="courseLevel"){const level=e.target.value;courseQuery=level;render();}
 const s=e.target.dataset.settingSelect;
 if(s){let v=e.target.value;if(s==="scale")v=Number(v);setSetting(s,v);}
 const color=e.target.dataset.settingColor;
 if(color)setSetting(color,e.target.value);
 const range=e.target.dataset.settingRange;
 if(range)setSetting(range,Number(e.target.value));
 const toggle=e.target.dataset.setting;
 if(toggle)setSetting(toggle,e.target.checked);
 if(e.target.id==="customLanguage")setLanguage(e.target.value);
 if(e.target.dataset.planDone!==undefined){data.plans[+e.target.dataset.planDone].done=e.target.checked;save();render();}

$("#app").addEventListener("click",e=>{
 const go=e.target.closest("[data-go]");
 if(go){navigate(go.dataset.go);return;}
 const ext=e.target.closest("[data-action]");
 if(ext){
  const a=ext.dataset.action;
  if(a==="restartQuiz"){startQuiz();return;}
  if(a==="addCard"){
   const q=$("#fcQ").value.trim(),ans=$("#fcA").value.trim();
   if(!q||!ans){toast("Enter both a question and answer.");return;}
   data.flashcards.push({q,a:ans});save();render();return;
  }
  if(a==="addPlan"){
   const task=$("#planTask").value.trim();if(!task){toast("Enter a task first.");return;}
   data.plans.push({task,date:$("#planDate").value,minutes:Math.max(5,Math.min(600,+$("#planMinutes").value||25)),done:false});save();render();return;
  }
  if(a==="addNote"){
   const title=$("#noteTitle").value.trim(),body=$("#noteBody").value.trim();
   if(!title||!body){toast("Enter a title and some note content.");return;}
   data.notes.unshift({title,body,subject:$("#noteSubject").value,date:new Date().toLocaleDateString()});save();render();return;
  }
  if(a==="solveDoubt"){
   const q=$("#doubtQuestion").value.trim(),attempt=$("#doubtAttempt").value.trim();
   if(!q){toast("Write your question first.");return;}
   $("#doubtOutput").innerHTML=`<div class="notice"><h3>Your problem-solving checklist</h3><ol><li>Underline the key words in your question.</li><li>Write down what you know.</li><li>Identify the exact step where you get stuck.</li><li>Try one small example.</li><li>Check your result against a textbook or teacher's explanation.</li></ol><p><strong>Your question:</strong> ${esc(q)}</p><p><strong>What you tried:</strong> ${esc(attempt||"Not entered yet")}</p></div>`;return;
  }
  if(a==="guest"){data.guest=true;data.displayName="Guest";data.account=null;save();render();toast("Guest mode enabled.");return;}
  if(a==="demoLogin"){
   const name=$("#accountName").value.trim()||"Learner";
   if(!$("#accountEmail").value.trim()||!$("#accountPassword").value){toast("Enter a display name, email and demo password.");return;}
   data.displayName=name;data.account={displayName:name,localDemo:true};data.guest=false;save();render();toast("Local demo profile created. No secure account was created.");return;
  }
  if(a==="saveGoal"){data.dailyGoal=Math.max(5,Math.min(600,+$("#dailyGoal").value||30));save();render();toast("Daily goal saved.");return;}
  if(a==="toggleLight"){setSetting("theme",data.settings.theme==="light"?"default":"light");return;}
  if(a==="toggleDensity"){setSetting("space",data.settings.space==="compact"?"normal":"compact");return;}
  if(a==="toggleCorners"){setSetting("radius",data.settings.radius==="normal"?"round":data.settings.radius==="round"?"sharp":"normal");return;}
  if(a==="resetDisplay"){data.settings={...DEFAULT.settings};save();applySettings();render();return;}
  if(a==="export"){downloadData();return;}
  if(a==="import"){const f=$("#importFile").files[0];if(!f){toast("Choose a JSON backup file first.");return;}const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||typeof x!=="object")throw Error();data={...DEFAULT,...x,settings:{...DEFAULT.settings,...x.settings}};save();render();toast("Backup imported.");}catch(e){toast("That backup file could not be read.");}};reader.readAsText(f);return;}
  if(a==="accessibility"){toast("Tip: use Tab to move through controls and Enter to activate them.");return;}
  if(a==="clearNotifications"){data.notifications=[];save();render();return;}
  if(a==="printCertificate"){window.print();return;}
  if(a==="resetData"){if(confirm("Delete all VEXO data saved in this browser? This cannot be undone.")){localStorage.removeItem("vexoData");data={...DEFAULT,settings:{...DEFAULT.settings}};render();}return;}
 }
 const c=e.target.closest("[data-course]");
 if(c){const course=COURSES.find(x=>x.id===c.dataset.course);data.lesson={course:course.id,n:1};save();navigate("lessons");return;}
 const l=e.target.closest("[data-complete]");
 if(l){const [id,n]=l.dataset.complete.split(":");markComplete(id,+n);return;}
 const nx=e.target.closest("[data-next]");
 if(nx){const [id,n]=nx.dataset.next.split(":");const c=COURSES.find(x=>x.id===id);data.lesson={course:id,n:+n<c.lessons?+n+1:1};save();render();return;}
 const g=e.target.closest("[data-game]");
 if(g){startGame(g.dataset.game);return;}
 const ans=e.target.closest("[data-answer]");
 if(ans){
  const q=quizQuestions[quizIndex],correct=+ans.dataset.answer===q.a;
  data.answers++;if(correct){gamePoints++;data.correct++;}
  data.quizTotal++;if(correct)data.quizScore++;
  save();
  $("#app").innerHTML=`<div class="card"><div class="icon">${correct?"✅":"📘"}</div><h2>${correct?"Correct!":"Not quite."}</h2><p>${esc(q.why)}</p><p>Score: ${gamePoints}/${quizIndex+1}</p><button class="btn primary" id="nextQuestion">${quizIndex===quizQuestions.length-1?"See results":"Next question →"}</button></div>`;
  $("#nextQuestion").onclick=()=>{quizIndex++;render();};return;
 }
 const delN=e.target.closest("[data-delete-note]");
 if(delN){data.notes.splice(+delN.dataset.deleteNote,1);save();render();return;}
 const delC=e.target.closest("[data-delete-card]");
 if(delC){data.flashcards.splice(+delC.dataset.deleteCard,1);save();render();return;}
 const delP=e.target.closest("[data-delete-plan]");
 if(delP){data.plans.splice(+delP.dataset.deletePlan,1);save();render();return;}
});

 const b=e.target.closest("[data-external]");
 if(b)window.open(b.dataset.external,"_blank","noopener,noreferrer");
});
$("#app").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");
 if(b&&b.dataset.go==="external:chatgpt"){window.open("https://chatgpt.com/","_blank","noopener,noreferrer");}
 if(b&&b.dataset.go==="external:gemini"){window.open("https://gemini.google.com/","_blank","noopener,noreferrer");}
});
let lastTick=Date.now();
setInterval(()=>{
 const now=Date.now(),elapsed=Math.max(0,Math.min(10,Math.floor((now-lastTick)/1000)));
 lastTick=now;
 if(!document.hidden&&elapsed>0){data.studySeconds+=elapsed;save();}
},5000);
